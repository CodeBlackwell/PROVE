[project]
name = "prove"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j",
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "openai",
    "anthropic",
    "python-dotenv",
    "tree-sitter",
    "pypdf",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "voyageai",
    "python-docx",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest",
    "pytest-timeout",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]  # intentionally-shaped sample code for the parser

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B008",  # FastAPI uses function calls (Depends/Query) in argument defaults
    "E501",  # line length owned by `ruff format`; remaining long lines are prompt/URL string literals
]

[tool.pytest.ini_options]
markers = ["e2e: browser end-to-end tests requiring a live server (deselect with -m 'not e2e')"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src"]
